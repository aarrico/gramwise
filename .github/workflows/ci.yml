name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: gofmt
              run: test -z "$(gofmt -l .)"
            - name: vet
              run: go vet ./...
            - name: lint
              uses: golangci/golangci-lint-action@v8
              with:
                  version: latest
            - name: test
              run: go test -race -tags=integration ./...
            - name: build
              run: go build ./...
            - name: docker build
              run: docker build -t gramwise-api .
